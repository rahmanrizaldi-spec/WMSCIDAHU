<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#092b24">
<title>WMS CIDAHU | PIA 100 KINO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#092b24}
.hero{
  position:relative;isolation:isolate;width:100%;min-height:100vh;min-height:100dvh;
  overflow:hidden;background:#092b24 url("background-cidahu.png") center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;padding:34px 18px 48px
}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(3,22,18,.16),rgba(4,25,22,.20) 48%,rgba(3,18,22,.12))}
.content{width:min(650px,92vw);margin-top:76px;text-align:center;color:#fff}
.brand{
  display:inline-flex;align-items:center;justify-content:center;gap:13px;
  margin-bottom:18px;padding:0 12px;text-shadow:0 3px 14px rgba(0,0,0,.45)
}
.brand-mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,#b77b32,#704018);border:2px solid rgba(255,226,163,.8);
  box-shadow:0 0 22px rgba(255,190,85,.35);font-family:Georgia,serif;font-size:16px;font-weight:bold}
.brand-name{font-family:Georgia,serif;font-size:clamp(27px,4vw,42px);font-weight:bold;letter-spacing:1px}
.brand-line{height:2px;width:120px;margin:0 auto 15px;background:linear-gradient(90deg,transparent,#8bffc0,transparent);
  box-shadow:0 0 12px #32ff9b}
.panel{
  position:relative;padding:22px 24px 26px;border:1px solid rgba(255,255,255,.48);
  border-radius:28px;background:rgba(14,42,37,.43);
  box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px)
}
.welcome{font-size:clamp(17px,2vw,22px);font-weight:600;color:#e7f4f0;margin-bottom:3px}
h1{margin:0;font-size:clamp(27px,4vw,38px);font-weight:800;letter-spacing:.5px;text-shadow:0 3px 12px rgba(0,0,0,.3)}
h1 span{color:#36e78b}
.subtitle{margin:7px 0 19px;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.82)}
.subtitle:before,.subtitle:after{content:"";display:inline-block;vertical-align:middle;width:26px;height:1px;
  margin:0 10px;background:#2be78c}
.launch{
  width:216px;min-height:214px;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:17px 14px;border-radius:23px;text-decoration:none;color:#fff;
  background:linear-gradient(145deg,rgba(0,166,91,.88),rgba(0,91,57,.86));
  border:1px solid rgba(102,255,180,.9);box-shadow:0 0 28px rgba(0,255,142,.35),inset 0 1px 15px rgba(255,255,255,.17);
  transition:transform .2s,box-shadow .2s,background .2s;-webkit-tap-highlight-color:transparent
}
.launch:hover{transform:translateY(-3px);background:linear-gradient(145deg,rgba(0,190,105,.96),rgba(0,105,66,.94));
  box-shadow:0 0 38px rgba(0,255,142,.55),inset 0 1px 15px rgba(255,255,255,.22)}
.launch:focus-visible{outline:3px solid #c4ffe0;outline-offset:5px}
.home-icon{width:78px;height:78px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(245,255,250,.98),rgba(183,244,211,.92));color:#087849;
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 5px 18px rgba(0,0,0,.2)}
.home-icon svg{width:53px;height:53px}
.launch strong{font-size:19px;letter-spacing:.2px}
.arrow{width:49px;height:49px;border:2px solid rgba(255,255,255,.9);border-radius:50%;
  display:grid;place-items:center;font-size:29px;line-height:1;margin-top:2px;
  box-shadow:0 0 16px rgba(255,255,255,.2)}
.note{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);color:rgba(255,255,255,.88);
  font-size:11px;text-shadow:0 1px 6px #000;white-space:nowrap}
@media(max-width:700px){
 .hero{background-position:center;background-size:auto 100%;padding:20px 14px 42px}
 .content{margin-top:80px;width:min(520px,96vw)}
 .brand{margin-bottom:12px}.brand-mark{width:39px;height:39px;font-size:13px}
 .panel{padding:20px 14px 22px;border-radius:22px}
 .subtitle{letter-spacing:2.5px;font-size:9px;margin-bottom:17px}
 .launch{width:190px;min-height:190px;border-radius:20px}
 .home-icon{width:68px;height:68px}
 .launch strong{font-size:17px}
 .note{font-size:9px;bottom:9px}
}
@media(max-height:650px) and (min-width:701px){
 .content{margin-top:25px}.brand{margin-bottom:8px}.brand-mark{width:38px;height:38px}
 .panel{padding:13px 20px 15px}.subtitle{margin:4px 0 10px}
 .launch{width:175px;min-height:165px}.home-icon{width:60px;height:60px}
 .arrow{width:40px;height:40px}
}
</style>
</head>
<body>
<main class="hero" aria-label="Portal WMS CIDAHU">
  <section class="content">
    <div class="brand">
      <div class="brand-mark">PIA<br>100</div>
      <div class="brand-name">KINO</div>
    </div>
    <div class="brand-line"></div>
    <div class="panel">
      <div class="welcome">Welcome to</div>
      <h1>WMS <span>CIDAHU</span></h1>
      <div class="subtitle">WAREHOUSE MANAGEMENT SYSTEM</div>
      <a class="launch"
         href="https://script.google.com/macros/s/AKfycby32nUrWdig0SnG0hkcS9gCrU-qidpJ1jv_Rp9lurvdb8IhaYLYZNMw59hE7o_wwk3j/exec"
         aria-label="Buka WMS CIDAHU" title="Buka WMS CIDAHU">
        <span class="home-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 28L32 8L57 28V55H7V28Z" fill="currentColor"/>
            <path d="M25 55V37H39V55M14 31H50" stroke="#E9FFF3" stroke-width="3" stroke-linejoin="round"/>
            <rect x="17" y="31" width="8" height="8" rx="1" fill="#E9FFF3"/>
            <rect x="28" y="25" width="8" height="8" rx="1" fill="#E9FFF3"/>
            <rect x="39" y="31" width="8" height="8" rx="1" fill="#E9FFF3"/>
          </svg>
        </span>
        <strong>WMS CIDAHU</strong>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>
  <div class="note">Klik kartu WMS CIDAHU untuk membuka sistem</div>
</main>
</body>
</html>
